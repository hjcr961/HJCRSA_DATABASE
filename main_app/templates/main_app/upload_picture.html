{% extends 'base.html' %}

{% block title %}Upload Picture{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto my-10">
    <div class="bg-white rounded-xl shadow-lg overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-[#1a237e] to-[#283593] px-6 py-4">
            <h2 class="text-2xl font-bold text-white">Upload Member Picture</h2>
        </div>
        
        <form method="POST" enctype="multipart/form-data" class="p-6">
            {% csrf_token %}
            
            <div class="space-y-6">
                <!-- Branch Member Number Field -->
                <div>
                    <label for="branch_member_number" class="block text-sm font-medium text-gray-700 mb-1">Branch Member Number</label>
                    <input type="text" name="branch_member_number" id="branch_member_number" required 
                           class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-[#1a237e] focus:border-[#1a237e] transition-all duration-200">
                </div>
                
                <!-- Picture Upload Area -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Member Picture</label>
                    <div id="upload-container" class="mt-1 flex flex-col items-center justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-[#1a237e] transition-all duration-200">
                        <!-- Upload Icon and Text -->
                        <div id="upload-prompt" class="text-center">
                            <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                            <div class="flex justify-center text-sm text-gray-600 mt-2">
                                <label for="picture" class="relative cursor-pointer bg-white rounded-md font-medium text-[#1a237e] hover:text-[#283593] focus-within:outline-none">
                                    <span>Upload a file</span>
                                    <input id="picture" name="picture" type="file" class="sr-only" accept="image/*" required>
                                </label>
                                <p class="pl-1">or drag and drop</p>
                            </div>
                            <p class="text-xs text-gray-500 mt-1">PNG, JPG, GIF up to 10MB</p>
                        </div>
                        
                        <!-- Image Preview Container (initially empty) -->
                        <div id="preview-container" class="w-full flex justify-center mt-4 hidden">
                            <img id="preview-image" class="h-48 w-auto object-cover rounded-lg shadow-md" alt="Preview">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="mt-8">
                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-[#1a237e] hover:bg-[#283593] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1a237e] transition-all duration-200">
                    Upload Picture
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.getElementById('picture').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                // Get the preview elements
                const previewContainer = document.getElementById('preview-container');
                const previewImage = document.getElementById('preview-image');
                const uploadPrompt = document.getElementById('upload-prompt');
                
                // Set the image source
                previewImage.src = e.target.result;
                
                // Show the preview, adjust the upload container
                previewContainer.classList.remove('hidden');
                uploadPrompt.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }
    });
</script>
{% endblock %}
