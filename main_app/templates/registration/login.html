{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HJCRSA - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{% static 'main_app/css/login.css' %}">
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="glass-effect rounded-2xl shadow-2xl p-8 fade-in">
            <!-- Logo Section -->
            <div class="logo-container text-center">
                <div class="logo-bg"></div>
                <div class="relative z-10">
                    <img src="{% static 'main_app/images/logo.png' %}"
                         class="logo-image mb-6"
                         alt="HJCRSA Logo"
                         style="width: 130px; height: 130px;" />
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
                    <p class="text-gray-600 text-sm">Sign in to your HJCRSA account</p>
                </div>
            </div>

            <!-- Error Messages -->
            {% if messages %}
                {% for message in messages %}
                    <div class="error-alert">
                        <i class="fas fa-exclamation-triangle"></i>
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}

            <!-- Login Form -->
            <form method="POST" class="space-y-6">
                {% csrf_token %}

                <!-- Username Field -->
                <div class="input-group">
                    <input
                        id="username"
                        name="username" 
                        type="text" 
                        required 
                        placeholder="Enter your username"
                        class="input-field"
                        autocomplete="username"
                    >
                    <i class="fas fa-user input-icon"></i>
                </div>

                <!-- Password Field -->
                <div class="input-group">
                    <input
                        id="password"
                        name="password" 
                        type="password" 
                        required 
                        placeholder="Enter your password"
                        class="input-field"
                        autocomplete="current-password"
                    >
                    <i class="fas fa-lock input-icon"></i>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" name="remember-me" class="checkbox-custom">
                        <span class="text-gray-700">Remember me</span>
                    </label>
                    <a href="#" class="text-primary-600 hover:text-primary-700 font-medium transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- Sign In Button -->
                <button type="submit" class="btn-primary w-full">
                    <span class="flex items-center justify-center gap-2">
                        <i class="fas fa-sign-in-alt"></i>
                        Sign In
                    </span>
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">New to HJCRSA?</span>
                </div>
            </div>

            <!-- Sign Up Link -->
            <div class="text-center">
                <a href="{% url 'signup' %}"
                   class="inline-flex items-center gap-2 text-primary-600 hover:text-primary-700 font-medium transition-colors">
                    <i class="fas fa-user-plus"></i>
                    Create an account
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8">
            <p class="text-white/80 text-sm">
                © 2024 HJCRSA. All rights reserved.
            </p>
        </div>
    </div>

    <script src="{% static 'main_app/js/login.js' %}"></script>
</body>
</html>
